# Nginx перед uvicorn — вариант С ДОМЕНОМ и сертификатом Let's Encrypt.
#
# Это шаблон: __DOMAIN__ подставляет deploy/setup_domain.sh, он же
# выпускает сертификат и перезагружает nginx. Ставить руками не нужно —
#   sudo deploy/setup_domain.sh ваш-домен.ru ваша@почта
#
# Что здесь важно для защиты:
# - весь HTTP уводится на HTTPS, кроме проверки домена для Let's Encrypt:
#   пароль и cookie не должны уходить по каналу, где их можно прочитать;
# - только TLS 1.2/1.3: старые версии ломаются известными атаками;
# - заголовки безопасности приложение ставит само (app/security.py) —
#   здесь они не дублируются, чтобы не разъезжаться в двух местах.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    server_tokens off;

    # Продление сертификата ходит по HTTP — эта проверка остаётся
    # доступной и после переезда сайта на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling: браузер проверяет, не отозван ли сертификат, не
    # ходя к удостоверяющему центру сам (иначе он узнаёт, что вы
    # заходили на этот сайт).
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # По этому заголовку приложение понимает, что соединение
        # защищено, и ставит cookie с флагом Secure (app/security.py).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
