# Пример конфига nginx (обратный прокси перед uvicorn).
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/arb-scanner
#   sudo ln -s /etc/nginx/sites-available/arb-scanner /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ваш-домен.ru;  # или IP сервера — тогда строку можно удалить

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
