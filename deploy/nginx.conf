# Nginx перед uvicorn — вариант БЕЗ домена (доступ по IP, только HTTP).
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/arb-scanner
#   sudo ln -s /etc/nginx/sites-available/arb-scanner /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Есть домен? Не правьте этот файл руками — запустите
#   sudo deploy/setup_domain.sh ваш-домен.ru ваша@почта
# скрипт выпустит сертификат Let's Encrypt и подставит конфиг с HTTPS
# (deploy/nginx-ssl.conf), включив в приложении secure-cookie и HSTS.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # любой Host: сайт открывают по IP сервера

    # Хватает и вилок, и росписи матча целиком; форма входа маленькая,
    # а больше сайт ничего не принимает.
    client_max_body_size 1m;

    # Своё имя сервера в ответах не раскрываем: версия nginx — это
    # готовая подсказка, какие уязвимости пробовать.
    server_tokens off;

    # Проверка домена для Let's Encrypt (см. deploy/setup_domain.sh).
    # Лежит здесь заранее, чтобы выпуск сертификата не требовал правок.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Лайв-сканер отдаёт данные обычными запросами, но обход БК идёт
        # десятками секунд — ответу нужно время дольше стандартного.
        proxy_read_timeout 120s;
    }
}
